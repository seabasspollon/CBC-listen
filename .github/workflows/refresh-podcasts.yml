name: Refresh CBC podcast episodes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest CBC episodes
        run: python scripts/update_podcasts.py

      - name: Commit updated episode data
        run: |
          if git diff --quiet -- latest.json; then
            echo "Episode data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Refresh latest CBC podcast episodes"
          git push
